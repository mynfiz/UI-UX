<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>GALERI</title>

<style>
    .galeri {
        background-color: mediumseagreen;
        padding: 15px;
        border-radius: 40px;
    }

    .gambar {
        float: left;
        width: 30%;
        margin: 1.5%;
        box-sizing: border-box;
        background-color: white;
        border: 1px solid #dddddd;
        padding: 8px;
        text-align: center;
    }

    .gambar img {
        width: 100%;
        height: 180px;
    }

    .gambar p {
        font-size: 16px;
        color: #333333;
    }

    .clear {
        clear: both;
    }

    .center {
        text-align: center;
    }

    .justify {
        text-align: justify;
    }
    .h1 {
        text-align: center;
        color: #333333;
    }
    .menu {
        margin: 1.5%;
    }
    @media screen and (max-width: 768px) {
        .gambar {
            width: 47%;
            margin: 1.5%;
        }
    }
    @media screen and (max-width: 480px) {
        body {
            margin: 10px;
        }
        .gambar {
            width: 97%;
            margin: 1.5%;
        }
        .gambar img {
            height: 200px;
        }
    }
</style>

<body>
    <h1 class="h1">Galeri Gambar</h1>

        <div class="gambar">
